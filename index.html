  <body>
    <div id="root"></div>
    <script>
      // Restore deep links redirected by public/404.html when the site runs on GitHub Pages.
      (function restoreGithubPagesRoute(locationParts) {
        if (!locationParts.search.startsWith('?/')) return;
        const route = locationParts.search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, '', locationParts.pathname.slice(0, -1) + route + locationParts.hash);
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
